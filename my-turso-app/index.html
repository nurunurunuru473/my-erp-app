  </style>
</head>
<body>
<!-- 📊 Dashboard -->
<div class="card">
  <h2>📊 ERP Dashboard</h2>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;">

    <div style="padding:20px;border-radius:12px;background:#eef6ff;">
      <h3>💰 Cash / Capital</h3>
      <p id="cashBalance" style="font-size:24px;font-weight:bold;">
        በመጫን ላይ...
      </p>
    </div>

    <div style="padding:20px;border-radius:12px;background:#eefbea;">
      <h3>📦 Stock</h3>
      <p id="stockTotal" style="font-size:24px;font-weight:bold;">
        በመጫን ላይ...
      </p>
    </div>

  </div>
</div>
<div class="container">
<!-- 📦 Products -->
<div class="card">
  <h2>📦 የምርት መመዝገቢያ</h2>
  <input id="productName" type="text" placeholder="የምርት ስም">
  <input id="productUnit" type="text" placeholder="Unit (pcs, kg, box...)">
  <input id="purchasePrice" type="number" placeholder="የግዢ ዋጋ">
  <input id="sellingPrice" type="number" placeholder="የሽያጭ ዋጋ">
  <input id="productStock" type="number" placeholder="የመጀመሪያ Stock">
  <button onclick="addProduct()">💾 ምርት መዝግብ</button>
</div>

<div class="card">
  <h2>📋 የተመዘገቡ ምርቶች</h2>
  <table>
    <thead><tr><th>ID</th><th>ምርት</th><th>Unit</th><th>ግዢ</th><th>ሽያጭ</th><th>Stock</th></tr></thead>
    <tbody id="productsTable"><tr><td colspan="6">በመጫን ላይ...</td></tr></tbody>
  </table>
</div>
<div class="card">
  <h2>📅 የትምህርት ዘመን</h2>
  <p id="season">በመጫን ላይ...</p>
</div>
  <!-- አዲስ መመዝገቢያ Form -->
  <div class="card">
    <h2>➕ አዲስ ተጠቃሚ መመዝገቢያ (ERP Dashboard)</h2>
    <div class="form-group">
      <input type="text" id="name" placeholder="ሙሉ ስም">
      <input type="email" id="email" placeholder="ኢሜይል አድራሻ">
      <button onclick="addUser()">መዝግብ</button>
    </div>
  </div>

  <!-- የተመዘገቡት ዝርዝር Table -->
  <div class="card">
    <h2>📋 የተመዘገቡ ተጠቃሚዎች</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>ስም</th>
          <th>ኢሜይል</th>
          <th>ሁኔታ</th>
        </tr>
      </thead>
      <tbody id="userTable">
        <!-- ዳታው እዚህ ይገባል -->
      </tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "/api/users";
async function loadSeason() {
  try {
    const res = await fetch("/api/seasons");
    const data = await res.json();

    const rows = data.results[0].response.result.rows || [];

    if (rows.length > 0) {
      document.getElementById("season").textContent = rows[0][1].value;
    } else {
      document.getElementById("season").textContent = "ምንም Season የለም";
    }
  } catch (err) {
    console.error("Error loading season:", err);
    document.getElementById("season").textContent = "Season መጫን አልተቻለም";
  }
}

loadSeason();
  // መረጃዎችን ከBackend አምጥቶ Table ውስጥ መሙላት
  async function loadUsers() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      const tbody = document.getElementById("userTable");
      tbody.innerHTML = "";

      // ከTurso የመጣውን Result መፈተሽ
      const rows = data.results[0].response.result.rows || [];
      
      rows.forEach(row => {
        const id = row[0].value;
        const name = row[1].value;
        const email = row[2].value;

        tbody.innerHTML += `
          <tr>
            <td>#${id}</td>
            <td><b>${name}</b></td>
            <td>${email}</td>
            <td><span class="badge">Active</span></td>
          </tr>
        `;
      });
    } catch (err) {
      console.error("Error loading users:", err);
    }
  }

  // አዲስ ተጠቃሚ መመዝገብ
  async function addUser() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    if (!name || !email) return alert("እባክዎን ስምና ኢሜይል ይሙሉ!");

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email })
    });

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    loadUsers(); // ሰንጠረዡን ማደስ
  }

  // ገጹ ሲከፈት መረጃዎችን አምጣ

// 📦 Products መረጃ ማምጣት
async function loadProducts() {
  try {
    const res = await fetch("/api/products");
    const data = await res.json();

    const rows = data.results?.[0]?.response?.result?.rows || [];
    const table = document.getElementById("productsTable");

    if (!rows.length) {
      table.innerHTML = `
        <tr>
          <td colspan="6">ምንም Product አልተመዘገበም</td>
        </tr>
      `;
      return;
    }

    table.innerHTML = rows.map(row => `
      <tr>
        <td>${row[0].value}</td>
        <td>${row[1].value}</td>
        <td>${row[2].value}</td>
        <td>${row[3].value}</td>
        <td>${row[4].value}</td>
        <td>${row[5].value}</td>
      </tr>
    `).join("");

  } catch (err) {
    console.error("Error loading products:", err);
  }
}

// 📦 አዲስ Product መመዝገብ
async function addProduct() {
  const name = document.getElementById("productName").value;
  const unit = document.getElementById("productUnit").value;
  const purchase_price = document.getElementById("purchasePrice").value;
  const selling_price = document.getElementById("sellingPrice").value;
  const stock = document.getElementById("productStock").value;

  if (!name) {
    return alert("እባክዎን የምርት ስም ያስገቡ!");
  }

  try {
    const res = await fetch("/api/products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        unit,
        purchase_price,
        selling_price,
        stock
      })
    });

    const data = await res.json();

    if (!res.ok) {
      return alert(data.error || "Product ማስገባት አልተሳካም");
    }

    alert("Product በትክክል ተመዝግቧል!");

    document.getElementById("productName").value = "";
    document.getElementById("productUnit").value = "";
    document.getElementById("purchasePrice").value = "";
    document.getElementById("sellingPrice").value = "";
    document.getElementById("productStock").value = "";


  } catch (err) {
    console.error("Error adding product:", err);
    alert("Product ማስገባት ላይ ስህተት ተፈጥሯል!");
  }
}
async function loadDashboard() {
  try {
    const cashRes = await fetch("/api/cash-balance");
    const cashData = await cashRes.json();

    const cashRows =
      cashData.results?.[0]?.response?.result?.rows || [];

    if (cashRows.length) {
      document.getElementById("cashBalance").textContent =
        Number(cashRows[0][0].value).toLocaleString() + " ETB";
    }

    const productsRes = await fetch("/api/products");
    const productsData = await productsRes.json();

    const productRows =
      productsData.results?.[0]?.response?.result?.rows || [];

    const totalStock = productRows.reduce(
      (total, row) => total + Number(row[5].value),
      0
    );

    document.getElementById("stockTotal").textContent =
      totalStock.toLocaleString();

  } catch (error) {
    console.error("Dashboard error:", error);
  }
}

loadDashboard();
loadProducts();  loadUsers();
</script>

</body>
</html>
