  </style>
</head>
<body>
<!-- 📊 Dashboard -->

  <h2>📊 ERP Dashboard</h2>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;">

    <div style="padding:20px;border-radius:12px;background:#eef6ff;">
      <h3>💰 Cash / Capital</h3>
      <p id="cashBalance" style="font-size:24px;font-weight:bold;">
        በመጫን ላይ...
      </p>
    </div>

    <div style="padding:20px;border-radius:12px;background:#eefbea;">
      <h3>📦 Stock</h3>
      <p id="stockTotal" style="font-size:24px;font-weight:bold;">
        በመጫን ላይ...
      </p>
    </div>

  </div>
</div>
<!-- 🛒 Purchases -->
<div class="card">
  <h2>🛒 የግዢ መመዝገቢያ</h2>
  <select id="purchaseProduct">
    <option value="">ምርት ይምረጡ</option>
  </select>
  <input id="purchaseQuantity" type="number" min="0.01" step="0.01" placeholder="ብዛት">
  <input id="purchaseUnitPrice" type="number" min="0" step="0.01" placeholder="የአንዱ ዋጋ">
  <input id="purchaseSupplier" type="text" placeholder="የአቅራቢ ስም">
  <p>ጠቅላላ ዋጋ: <strong id="purchaseTotal">0 ETB</strong></p>
  <button onclick="registerPurchase()">💾 ግዢ መዝግብ</button>
</div>
<div class="container">
<!-- 🛍️ Sales -->
<div class="card">
  <h2>🛍️ የሽያጭ መመዝገቢያ</h2>

  <select id="saleProduct">
    <option value="">ምርት ይምረጡ</option>
  </select>

  <input id="saleQuantity" type="number" min="0.01" step="0.01" placeholder="ብዛት">

  <input id="saleUnitPrice" type="number" min="0" step="0.01" placeholder="የአንዱ ዋጋ">

  <input id="saleCustomer" type="text" placeholder="የደንበኛ ስም">

  <p>ጠቅላላ ዋጋ: <strong id="saleTotal">0 ETB</strong></p>

  <button onclick="registerSale()">💾 ሽያጭ መዝግብ</button>
</div>

<!-- 💰 Income -->
<div class="card">
  <h2>💰 የገቢ መመዝገቢያ</h2>

  <input id="incomeDescription" type="text" placeholder="የገቢ ምክንያት">

  <input id="incomeAmount" type="number" min="0.01" step="0.01" placeholder="የገቢ መጠን">

  <button onclick="registerIncome()">💾 ገቢ መዝግብ</button>
</div>

<!-- 📦 Products -->
<div class="card">
  <h2>📦 የምርት መመዝገቢያ</h2>
  <input id="productName" type="text" placeholder="የምርት ስም">
  <input id="productUnit" type="text" placeholder="Unit (pcs, kg, box...)">
  <input id="purchasePrice" type="number" placeholder="የግዢ ዋጋ">
  <input id="sellingPrice" type="number" placeholder="የሽያጭ ዋጋ">
  <button onclick="addProduct()">💾 ምርት መዝግብ</button>
</div>

<div class="card">
  <h2>📋 የተመዘገቡ ምርቶች</h2>
  <table>
    <thead><tr><th>ID</th><th>ምርት</th><th>Unit</th><th>ግዢ</th><th>ሽያጭ</th><th>Stock</th></tr></thead>
    <tbody id="productsTable"><tr><td colspan="6">በመጫን ላይ...</td></tr></tbody>
  </table>
</div>
<div class="card">
  <h2>📅 የትምህርት ዘመን</h2>
  <p id="season">በመጫን ላይ...</p>
</div>
  <!-- አዲስ መመዝገቢያ Form -->
<div class="card">
    <h2>➕ አዲስ ተጠቃሚ መመዝገቢያ (ERP Dashboard)</h2>
    <div class="form-group">
      <input type="text" id="name" placeholder="ሙሉ ስም">
      <input type="email" id="email" placeholder="ኢሜይል አድራሻ">
      <button onclick="addUser()">መዝግብ</button>
    </div>
  </div>

  <!-- የተመዘገቡት ዝርዝር Table -->
<div class="card">
    <h2>📋 የተመዘገቡ ተጠቃሚዎች</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>ስም</th>
          <th>ኢሜይል</th>
          <th>ሁኔታ</th>
        </tr>
      </thead>
      <tbody id="userTable">
        <!-- ዳታው እዚህ ይገባል -->
      </tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "/api/users";
async function loadSeason() {
  try {
    const res = await fetch("/api/seasons");
    const data = await res.json();

    const rows = data.results[0].response.result.rows || [];

    if (rows.length > 0) {
      document.getElementById("season").textContent = rows[0][1].value;
    } else {
      document.getElementById("season").textContent = "ምንም Season የለም";
    }
  } catch (err) {
    console.error("Error loading season:", err);
    document.getElementById("season").textContent = "Season መጫን አልተቻለም";
  }
}

loadSeason();
  // መረጃዎችን ከBackend አምጥቶ Table ውስጥ መሙላት
  async function loadUsers() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      const tbody = document.getElementById("userTable");
      tbody.innerHTML = "";

      // ከTurso የመጣውን Result መፈተሽ
      const rows = data.results[0].response.result.rows || [];
      
      rows.forEach(row => {
        const id = row[0].value;
        const name = row[1].value;
        const email = row[2].value;

        tbody.innerHTML += `
          <tr>
            <td>#${id}</td>
            <td><b>${name}</b></td>
            <td>${email}</td>
            <td><span class="badge">Active</span></td>
          </tr>
        `;
      });
    } catch (err) {
      console.error("Error loading users:", err);
    }
  }

  // አዲስ ተጠቃሚ መመዝገብ
  async function addUser() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    if (!name || !email) return alert("እባክዎን ስምና ኢሜይል ይሙሉ!");

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email })
    });

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    loadUsers(); // ሰንጠረዡን ማደስ
  }

  // ገጹ ሲከፈት መረጃዎችን አምጣ

// 📦 Products መረጃ ማምጣት
async function loadProducts() {
  try {
    const res = await fetch("/api/products");
    const data = await res.json();

    const rows = data.results?.[0]?.response?.result?.rows || [];
    const table = document.getElementById("productsTable");

    if (!rows.length) {
      table.innerHTML = `
        <tr>
          <td colspan="6">ምንም Product አልተመዘገበም</td>
        </tr>
      `;
      return;
    }

    table.innerHTML = rows.map(row => `
      <tr>
        <td>${row[0].value}</td>
        <td>${row[1].value}</td>
        <td>${row[2].value}</td>
        <td>${row[3].value}</td>
        <td>${row[4].value}</td>
        <td>${row[5].value}</td>
      </tr>
    `).join("");

  } catch (err) {
    console.error("Error loading products:", err);
  }
}

// 📦 አዲስ Product መመዝገብ
async function addProduct() {
  const name = document.getElementById("productName").value;
  const unit = document.getElementById("productUnit").value;
  const purchase_price = document.getElementById("purchasePrice").value;
  const selling_price = document.getElementById("sellingPrice").value;

  if (!name) {
    return alert("እባክዎን የምርት ስም ያስገቡ!");
  }

  try {
    const res = await fetch("/api/products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        unit,
        purchase_price,
        selling_price,
      })
    });

    const data = await res.json();

    if (!res.ok) {
      return alert(data.error || "Product ማስገባት አልተሳካም");
    }

    alert("Product በትክክል ተመዝግቧል!");

    document.getElementById("productName").value = "";
    document.getElementById("productUnit").value = "";
    document.getElementById("purchasePrice").value = "";
    document.getElementById("sellingPrice").value = "";


  } catch (err) {
    console.error("Error adding product:", err);
    alert("Product ማስገባት ላይ ስህተት ተፈጥሯል!");
  }
}
async function loadDashboard() {
  try {
    const cashRes = await fetch("/api/cash-balance");
    const cashData = await cashRes.json();

    const cashRows =
      cashData.results?.[0]?.response?.result?.rows || [];

    if (cashRows.length) {
      document.getElementById("cashBalance").textContent =
        Number(cashRows[0][0].value).toLocaleString() + " ETB";
    }

    const productsRes = await fetch("/api/products");
    const productsData = await productsRes.json();

    const productRows =
      productsData.results?.[0]?.response?.result?.rows || [];

    const totalStock = productRows.reduce(
      (total, row) => total + Number(row[5].value),
      0
    );

    document.getElementById("stockTotal").textContent =
      totalStock.toLocaleString();

  } catch (error) {
    console.error("Dashboard error:", error);
  }
}

loadDashboard();
loadProducts();  loadUsers();

async function loadPurchaseProducts() {
  try {
    const res = await fetch("/api/products");
    const data = await res.json();

    const rows = data.results?.[0]?.response?.result?.rows || [];
    const select = document.getElementById("purchaseProduct");

    select.innerHTML = '<option value="">ምርት ይምረጡ</option>';

    rows.forEach(row => {
      const option = document.createElement("option");
      option.value = row[0].value;
      option.textContent = `${row[1].value} (Stock: ${row[5].value})`;
      option.dataset.price = row[3].value;
      select.appendChild(option);
    });
  } catch (err) {
    console.error("Purchase products error:", err);
  }
}

document.getElementById("purchaseProduct").addEventListener("change", function () {
  const option = this.options[this.selectedIndex];
  document.getElementById("purchaseUnitPrice").value =
    option.dataset.price || "";

  calculatePurchaseTotal();
});

function calculatePurchaseTotal() {
  const quantity = Number(document.getElementById("purchaseQuantity").value) || 0;
  const price = Number(document.getElementById("purchaseUnitPrice").value) || 0;
  const total = quantity * price;

  document.getElementById("purchaseTotal").textContent =
    total.toLocaleString() + " ETB";
}

document.getElementById("purchaseQuantity").addEventListener(
  "input",
  calculatePurchaseTotal
);

document.getElementById("purchaseUnitPrice").addEventListener(
  "input",
  calculatePurchaseTotal
);

async function registerPurchase() {
  const product_id = document.getElementById("purchaseProduct").value;
  const quantity = Number(document.getElementById("purchaseQuantity").value);
  const unit_price = Number(document.getElementById("purchaseUnitPrice").value);
  const supplier = document.getElementById("purchaseSupplier").value.trim();

  if (!product_id) {
    return alert("እባክዎን ምርት ይምረጡ!");
  }

  if (!Number.isFinite(quantity) || quantity <= 0) {
    return alert("እባክዎን ትክክለኛ ብዛት ያስገቡ!");
  }

  if (!Number.isFinite(unit_price) || unit_price <= 0) {
    return alert("እባክዎን ትክክለኛ የአንዱ ዋጋ ያስገቡ!");
  }

  try {
    const res = await fetch("/api/purchases", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        product_id: Number(product_id),
        quantity,
        unit_price,
        supplier
      })
    });

    const data = await res.json();

    if (!res.ok) {
      return alert(data.error || "ግዢ ማስገባት አልተሳካም");
    }

    alert("ግዢ በትክክል ተመዝግቧል!");

    document.getElementById("purchaseProduct").value = "";
    document.getElementById("purchaseQuantity").value = "";
    document.getElementById("purchaseUnitPrice").value = "";
    document.getElementById("purchaseSupplier").value = "";
    document.getElementById("purchaseTotal").textContent = "0 ETB";

    await loadPurchaseProducts();
    await loadProducts();
    await loadDashboard();

  } catch (err) {
    console.error("Purchase error:", err);
    alert("ግዢ ማስገባት ላይ ስህተት ተፈጥሯል!");
  }
}

loadPurchaseProducts();


async function loadSaleProducts() {
  try {
    const res = await fetch("/api/products");
    const data = await res.json();

    const rows = data.results?.[0]?.response?.result?.rows || [];
    const select = document.getElementById("saleProduct");

    select.innerHTML = '<option value="">ምርት ይምረጡ</option>';

    rows.forEach(row => {
      const option = document.createElement("option");
      option.value = row[0].value;
      option.textContent = `${row[1].value} (Stock: ${row[5].value})`;
      option.dataset.price = row[4].value;
      option.dataset.stock = row[5].value;
      select.appendChild(option);
    });
  } catch (err) {
    console.error("Sale products error:", err);
  }
}

document.getElementById("saleProduct").addEventListener("change", function () {
  const option = this.options[this.selectedIndex];

  document.getElementById("saleUnitPrice").value =
    option.dataset.price || "";

  calculateSaleTotal();
});

function calculateSaleTotal() {
  const quantity =
    Number(document.getElementById("saleQuantity").value) || 0;

  const price =
    Number(document.getElementById("saleUnitPrice").value) || 0;

  const total = quantity * price;

  document.getElementById("saleTotal").textContent =
    total.toLocaleString() + " ETB";
}

document.getElementById("saleQuantity").addEventListener(
  "input",
  calculateSaleTotal
);

document.getElementById("saleUnitPrice").addEventListener(
  "input",
  calculateSaleTotal
);

async function registerSale() {
  const product_id =
    document.getElementById("saleProduct").value;

  const quantity =
    Number(document.getElementById("saleQuantity").value);

  const unit_price =
    Number(document.getElementById("saleUnitPrice").value);

  const customer =
    document.getElementById("saleCustomer").value.trim();

  if (!product_id) {
    return alert("እባክዎን ምርት ይምረጡ!");
  }

  if (!Number.isFinite(quantity) || quantity <= 0) {
    return alert("እባክዎን ትክክለኛ ብዛት ያስገቡ!");
  }

  if (!Number.isFinite(unit_price) || unit_price <= 0) {
    return alert("እባክዎን ትክክለኛ የአንዱ ዋጋ ያስገቡ!");
  }

  const selectedOption =
    document.getElementById("saleProduct").options[
      document.getElementById("saleProduct").selectedIndex
    ];

  const stock = Number(selectedOption.dataset.stock) || 0;

  if (quantity > stock) {
    return alert(
      `በቂ Stock የለም! ያለው Stock: ${stock}`
    );
  }

  try {
    const res = await fetch("/api/sales", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        product_id: Number(product_id),
        quantity,
        unit_price,
        customer
      })
    });

    const data = await res.json();

    if (!res.ok) {
      return alert(
        data.error || "ሽያጭ ማስገባት አልተሳካም"
      );
    }

    alert("ሽያጭ በትክክል ተመዝግቧል!");

    document.getElementById("saleProduct").value = "";
    document.getElementById("saleQuantity").value = "";
    document.getElementById("saleUnitPrice").value = "";
    document.getElementById("saleCustomer").value = "";
    document.getElementById("saleTotal").textContent = "0 ETB";

    await loadSaleProducts();
    await loadProducts();
    await loadDashboard();

  } catch (err) {
    console.error("Sale error:", err);
    alert("ሽያጭ ማስገባት ላይ ስህተት ተፈጥሯል!");
  }
}

loadSaleProducts();


async function registerIncome() {
  const description =
    document.getElementById("incomeDescription").value.trim();

  const amount =
    Number(document.getElementById("incomeAmount").value);

  if (!description) {
    return alert("እባክዎን የገቢ ምክንያት ያስገቡ!");
  }

  if (!Number.isFinite(amount) || amount <= 0) {
    return alert("እባክዎን ትክክለኛ የገቢ መጠን ያስገቡ!");
  }

  try {
    const res = await fetch("/api/income", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        description,
        amount
      })
    });

    const data = await res.json();

    if (!res.ok) {
      return alert(
        data.error || "ገቢ ማስገባት አልተሳካም"
      );
    }

    alert("ገቢ በትክክል ተመዝግቧል!");

    document.getElementById("incomeDescription").value = "";
    document.getElementById("incomeAmount").value = "";

    await loadDashboard();

  } catch (err) {
    console.error("Income error:", err);
    alert("ገቢ ማስገባት ላይ ስህተት ተፈጥሯል!");
  }
}

</script>

</body>
</html>
