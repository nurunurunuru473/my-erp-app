<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP User Management</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f7fe; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: #ffffff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; }
    h2 { color: #2b3674; margin-bottom: 15px; font-size: 20px; }
    .form-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    input { flex: 1; min-width: 200px; padding: 12px 15px; border: 1px solid #e0e5f2; border-radius: 8px; outline: none; font-size: 14px; }
    input:focus { border-color: #4318ff; }
    button { background: #4318ff; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #3311cc; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background-color: #f7f9fc; color: #a3edd6; text-align: left; padding: 12px; font-size: 13px; color: #a324f2; text-transform: uppercase; }
    td { padding: 12px; border-bottom: 1px solid #e0e5f2; font-size: 14px; }
    tr:hover { background-color: #f8f9ff; }
    .badge { background: #e6faf5; color: #05cd99; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <!-- አዲስ መመዝገቢያ Form -->
  <div class="card">
    <h2>➕ አዲስ ተጠቃሚ መመዝገቢያ (ERP Dashboard)</h2>
    <div class="form-group">
      <input type="text" id="name" placeholder="ሙሉ ስም">
      <input type="email" id="email" placeholder="ኢሜይል አድራሻ">
      <button onclick="addUser()">መዝግብ</button>
    </div>
  </div>

  <!-- የተመዘገቡት ዝርዝር Table -->
  <div class="card">
    <h2>📋 የተመዘገቡ ተጠቃሚዎች</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>ስም</th>
          <th>ኢሜይል</th>
          <th>ሁኔታ</th>
        </tr>
      </thead>
      <tbody id="userTable">
        <!-- ዳታው እዚህ ይገባል -->
      </tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "http://localhost:3000/api/users";

  // መረጃዎችን ከBackend አምጥቶ Table ውስጥ መሙላት
  async function loadUsers() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      const tbody = document.getElementById("userTable");
      tbody.innerHTML = "";

      // ከTurso የመጣውን Result መፈተሽ
      const rows = data.results[0].response.result.rows || [];
      
      rows.forEach(row => {
        const id = row[0].value;
        const name = row[1].value;
        const email = row[2].value;

        tbody.innerHTML += `
          <tr>
            <td>#${id}</td>
            <td><b>${name}</b></td>
            <td>${email}</td>
            <td><span class="badge">Active</span></td>
          </tr>
        `;
      });
    } catch (err) {
      console.error("Error loading users:", err);
    }
  }

  // አዲስ ተጠቃሚ መመዝገብ
  async function addUser() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    if (!name || !email) return alert("እባክዎን ስምና ኢሜይል ይሙሉ!");

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email })
    });

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    loadUsers(); // ሰንጠረዡን ማደስ
  }

  // ገጹ ሲከፈት መረጃዎችን አምጣ
  loadUsers();
</script>

</body>
</html>
